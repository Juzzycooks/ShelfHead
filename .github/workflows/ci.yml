name: CI

# Builds all three targets and runs both unit test bundles on every push/PR. This exists
# because every change to this project up to this point had only ever been verified by
# static reading (no compiler/simulator available in that environment) — a real build
# is the one thing that class of review is structurally blind to, and recent changes
# (a new watchOS target, a rewritten networking service, C-callback audio code) are
# exactly the kind that reading alone can't fully validate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-app:
    name: Build + Test (iOS app)
    # Pinned to the macOS 26 image (Xcode 26.x / iOS 26 SDK) — not optional here, unlike
    # the Xcode *version* note below. RetroComponents.swift and ContentView.swift use
    # `.glassEffect()` / `GlassEffectContainer`, iOS 26 SDK symbols. `#available` only
    # gates *runtime* behavior; the symbols still have to exist in the SDK this is built
    # against, or it's a compile error, not a runtime skip. macOS 15 ships Xcode 16.x
    # with the iOS 18 SDK, which doesn't have these symbols at all — that build would
    # fail and look exactly like a real code error instead of a stale runner image.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Uses whichever Xcode the runner image defaults to (usually the latest stable
      # release) rather than pinning a specific *version* — this app tracks current-year
      # SDK features, so a hardcoded version number here would need to be bumped by
      # hand every time Apple ships a new Xcode and would otherwise silently go stale.
      # If a specific version is ever needed instead, use maxim-lobanov/setup-xcode.
      # (The `runs-on` image above is the one pin that actually matters: it fixes the
      # SDK major version, which is a compile-time requirement, not a preference.)
      - name: Show selected Xcode version
        run: xcodebuild -version

      # The simulator set is part of the runner image, so a hardcoded device name goes
      # stale exactly when the image is updated — this job was pinned to "iPhone 16"
      # while macos-26 ships the iPhone 17 family, which fails as "unavailable
      # destination" and reads like a build break rather than a stale name. Resolving a
      # real device off the runner keeps the *image* as the only thing pinned (see the
      # `runs-on` note above), which is the pin that actually has to be deliberate.
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          set -o pipefail
          # Newest installed iOS runtime, then its first iPhone. Reported as a UDID
          # rather than a name so the destination can't be a name/OS pair that doesn't
          # actually exist together (the failure mode `name=...,OS=latest` has).
          read -r udid label <<<"$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def ios_version(runtime):
              match = re.search(r"iOS-([0-9-]+)$", runtime)
              return tuple(int(part) for part in match.group(1).split("-")) if match else None
          found = []
          for runtime, entries in devices.items():
              version = ios_version(runtime)
              if version is None:
                  continue
              for entry in entries:
                  if entry["name"].startswith("iPhone"):
                      found.append((version, entry["udid"], entry["name"]))
          found.sort(key=lambda item: item[0], reverse=True)
          if found:
              print(found[0][1], found[0][2])
          ')"
          if [ -z "$udid" ]; then
            echo "No available iPhone simulator on this runner image:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $label ($udid)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # No `CODE_SIGNING_ALLOWED=NO` here, unlike the two build-only jobs below. That
      # flag also drops the entitlements file, and without it the App Group is not
      # provisioned — `containerURL(forSecurityApplicationGroupIdentifier:)` returns nil,
      # so `WidgetLibraryPublisherTests` (`testCoverFilenamesAreSafeForHostileItemIds`,
      # `testPruneRemovesCoversNoLongerPublished`) fail on a container the app itself has
      # at runtime. A simulator build signs ad hoc with no team or certificate, so
      # leaving signing enabled costs this job nothing. The build-only jobs keep the flag
      # (nothing there exercises the container, and it's one less moving part).
      - name: Build + run unit tests (ShelfHead + ShelfHeadTests)
        run: |
          set -o pipefail
          xcodebuild test \
            -project ShelfHead.xcodeproj \
            -scheme ShelfHead \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipMacroValidation

      # Only useful once the build above has actually failed — `failure()` is always
      # false if this step runs before the thing that might fail.
      - name: Show available destinations (debugging aid on failure)
        if: failure()
        run: xcodebuild -project ShelfHead.xcodeproj -scheme ShelfHead -showdestinations

  build-widget-extension:
    name: Build (Widgets extension)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # See the app-build job above for why this isn't pinned to a specific version
      # (and why the runner image above is pinned to macOS 26 instead).
      - name: Show selected Xcode version
        run: xcodebuild -version

      - name: Build ShelfHeadWidgetsExtension
        run: |
          set -o pipefail
          xcodebuild build \
            -project ShelfHead.xcodeproj \
            -scheme ShelfHeadWidgetsExtension \
            -destination "generic/platform=iOS Simulator" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Show available destinations (debugging aid on failure)
        if: failure()
        run: xcodebuild -project ShelfHead.xcodeproj -scheme ShelfHeadWidgetsExtension -showdestinations

  build-and-test-watch-app:
    name: Build + Test (Watch app)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # See the app-build job above for why this isn't pinned to a specific version
      # (and why the runner image above is pinned to macOS 26 instead).
      - name: Show selected Xcode version
        run: xcodebuild -version

      # Same idea as the iPhone picker above: newest installed watchOS runtime, first
      # Apple Watch on it, reported as a UDID. A generic destination is enough to
      # *build*, but `xcodebuild test` needs a concrete simulator to boot.
      - name: Pick an available Apple Watch simulator
        id: watchsim
        run: |
          set -o pipefail
          read -r udid label <<<"$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def watchos_version(runtime):
              match = re.search(r"watchOS-([0-9-]+)$", runtime)
              return tuple(int(part) for part in match.group(1).split("-")) if match else None
          found = []
          for runtime, entries in devices.items():
              version = watchos_version(runtime)
              if version is None:
                  continue
              for entry in entries:
                  if entry["name"].startswith("Apple Watch"):
                      found.append((version, entry["udid"], entry["name"]))
          found.sort(key=lambda item: item[0], reverse=True)
          if found:
              print(found[0][1], found[0][2])
          ')"
          if [ -z "$udid" ]; then
            echo "No available Apple Watch simulator on this runner image:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $label ($udid)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Batch 313 (10 Sept 2026, REVIEW-2026-09-09-REMAINING item 36): a shared
      # `ShelfHead Watch.xcscheme` now exists in `xcshareddata`, so this job builds
      # through the scheme (which is also what Xcode does locally — a `-target` build
      # once passed while the scheme build rejected an isolation error, see HANDOFF.md)
      # and runs the Watch unit bundle. `-only-testing` pins the unit bundle because the
      # UI-test target's runner has never launched and is not part of pass/fail. Signing
      # stays enabled for the same App Group reason as the iOS test job.
      - name: Build + run unit tests ("ShelfHead Watch" + "ShelfHead Watch Tests")
        run: |
          set -o pipefail
          xcodebuild test \
            -project ShelfHead.xcodeproj \
            -scheme "ShelfHead Watch" \
            -destination "platform=watchOS Simulator,id=${{ steps.watchsim.outputs.udid }}" \
            -only-testing:"ShelfHead Watch Tests" \
            -skipMacroValidation

      - name: Show available destinations (debugging aid on failure)
        if: failure()
        run: xcodebuild -project ShelfHead.xcodeproj -scheme "ShelfHead Watch" -showdestinations
